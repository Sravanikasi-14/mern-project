    <circle cx="28" cy="28" r="8" fill="#c9ddd0"/>
    <text x="48" y="33" font-size="13" font-weight="700" fill="#14241c" font-family="Segoe UI, Arial, sans-serif">Plan sprint goals</text>
    <text x="20" y="62" font-size="12" fill="#5b6b62" font-family="Segoe UI, Arial, sans-serif">Assigned · In progress</text>
    <rect x="240" y="0" width="220" height="88" rx="12" fill="#eef6f0" stroke="#c9ddd0"/>
    <circle cx="268" cy="28" r="8" fill="#1f5c45"/>
    <text x="288" y="33" font-size="13" font-weight="700" fill="#14241c" font-family="Segoe UI, Arial, sans-serif">Review leave queue</text>
    <text x="260" y="62" font-size="12" fill="#5b6b62" font-family="Segoe UI, Arial, sans-serif">Done · Shared update</text>
    <rect x="480" y="0" width="220" height="88" rx="12" fill="#1f5c45"/>
    <circle cx="508" cy="28" r="8" fill="#dceee3"/>
    <text x="528" y="33" font-size="13" font-weight="700" fill="#fff" font-family="Segoe UI, Arial, sans-serif">Message the team</text>
