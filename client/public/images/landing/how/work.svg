<svg xmlns="http://www.w3.org/2000/svg" width="840" height="408" viewBox="0 0 840 408" role="img" aria-label="Keep work moving">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7faf5"/>
      <stop offset="100%" stop-color="#e8f2eb"/>
    </linearGradient>
  </defs>
  <rect width="840" height="408" fill="url(#bg)"/>
  <rect x="28" y="28" width="784" height="352" rx="16" fill="#fff" stroke="#d5e3d9"/>
  <text x="56" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f5c45">04 · WORK</text>
  <text x="56" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#14241c">Keep Work Moving</text>
  <text x="56" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5b6b62">Coordinate tasks, track progress, keep people connected.</text>
  <g transform="translate(56 198)">
